name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push to the same PR cancels the run it obsoletes — macOS runners are the slow,
# scarce kind. Runs on main are never cancelled: every merge commit keeps its full record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux mirror of the script halves: not authoritative (the macOS job is — the hooks run on
  # macOS), but it finishes minutes earlier and doubles as proof the Python/Node suites stay
  # runnable for contributors and CI off macOS. Shellcheck lives here because ubuntu ships it.
  scripts-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Node tests
        run: node --test tests/*.test.js

      # -x follows the sourced identity.env (declared with a shellcheck source= directive).
      - name: Shell scripts pass shellcheck
        run: shellcheck -x build.sh hooks/statusline.sh

  # The job below builds with macos-latest's compiler, and that is newer than the Swift in many a
  # Mac's Command Line Tools — while the plugin compiles the app on the user's own Mac, with
  # whatever Swift is there. Swift 6.0.3 gave up type-checking a Settings page the runner's
  # compiler accepted ("unable to type-check this expression in reasonable time"), so build.sh
  # failed for those users and nothing here noticed. A type-check is enough to catch that class:
  # the solver gives up long before code generation. Fails loudly when the image stops shipping
  # a Swift 6.0 Xcode — then pin an older image or retire the job, but do not let it pass empty.
  swift-6-0:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Type-check the app with Swift 6.0
        run: |
          developer=""
          for app in /Applications/Xcode_16.2*.app /Applications/Xcode_16.1*.app /Applications/Xcode_16.0*.app /Applications/Xcode_16*.app; do
            [ -d "$app" ] || continue
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun swiftc --version 2>&1 | grep -q "Swift version 6\.0"; then
              developer="$app/Contents/Developer"
              break
            fi
          done
          if [ -z "$developer" ]; then
            echo "No Xcode with Swift 6.0 on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          DEVELOPER_DIR="$developer" xcrun swiftc --version
          DEVELOPER_DIR="$developer" xcrun swiftc -typecheck -target arm64-apple-macos13.0 \
            Sources/*.swift Sources/Model/*.swift -framework Cocoa -framework SwiftUI

  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The backend deliberately runs on the system python and the standard library alone: it is
      # launched by a GUI process, where neither pyenv nor nvm is on PATH.
      #
      # Step order is load-bearing: the Python suite writes build/seam/mcp.json and the Node
      # suite writes build/seam/session.json, and the Swift model checks below parse BOTH —
      # that is the only test crossing the language border, so the script suites must run first.
      - name: Python tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

      - name: Node tests
        run: node --test tests/*.test.js

      # No Xcode project here (the app builds with a bare swiftc), so the model checks are a
      # plain executable that exits non-zero on the first failure. Sources/Model/ is the whole
      # UI-free half by construction — a new model file is picked up without touching this list,
      # and a model file that reaches into the app fails to link here, which is the point.
      - name: Swift model checks
        run: |
          swiftc -O Sources/Model/*.swift tests/model/main.swift -o "$RUNNER_TEMP/model" -framework Cocoa
          "$RUNNER_TEMP/model"

      # --dmg on every push, not just in the Release workflow: the image is packaged on a runner
      # nobody sits at (hdiutil, a Finder that may refuse Apple events), and a release is the
      # wrong place to learn that the runner cannot do it — by then the release already exists
      # without its asset.
      - name: Build the app and the DMG
        run: CONTROL_BAR_APP="$RUNNER_TEMP/Claude Control Bar.app" bash build.sh --dmg

      # The DMG this run just proved it can build is worth keeping for a week: a reviewer of a
      # visual change installs it from the run page instead of building the branch by hand.
      # Ad-hoc signed, unnotarized — Gatekeeper wants a right-click Open the first time.
      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Control-Bar-dmg
          path: build/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Manifests are valid JSON
        run: |
          /usr/bin/python3 -c "
          import json
          for path in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'hooks/hooks.json'):
              json.load(open(path)); print(path, 'ok')
          "

      # plugin.json is the single source of the version. Compared against the BUILT bundle, not
      # against the text of build.sh — a hardcoded plist would otherwise pass review forever.
      - name: One version everywhere
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/Claude Control Bar.app" <<'PY'
          import json, plistlib, sys
          want = json.load(open('.claude-plugin/plugin.json'))['version']
          market = json.load(open('.claude-plugin/marketplace.json'))['plugins']
          bad = [e['name'] for e in market if e.get('version') != want]
          if bad:
              sys.exit(f'marketplace.json disagrees with plugin.json={want}: {bad}')
          with open(sys.argv[1] + '/Contents/Info.plist', 'rb') as fh:
              info = plistlib.load(fh)
          for key in ('CFBundleShortVersionString', 'CFBundleVersion'):
              if info[key] != want:
                  sys.exit(f'built bundle {key}={info[key]}, expected {want}')
          print('version agrees everywhere:', want)
          PY

      # The hook scripts cannot read identity.env — install.js copies them out of the repo into
      # ~/.claude/control-bar/ — so they carry the same literals inline. This is the guard that
      # keeps the two from drifting apart, which is how a rename half-applies.
      - name: Identity is consistent
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/Claude Control Bar.app" <<'PY'
          import plistlib, sys
          ident = {}
          for line in open('identity.env'):
              line = line.strip()
              if line and not line.startswith('#') and '=' in line:
                  k, _, v = line.partition('=')
                  ident[k.strip()] = v.strip().strip('"')
          bundle, exe = ident['BUNDLE_ID'], ident['EXEC']
          checks = [
              ('hooks/lifecycle.js', [bundle, exe]),
              ('hooks/update.js', [bundle, exe]),
              ('hooks/uninstall.js', [exe]),
              ('hooks/install.js', [ident['STATE_DIR'].split('/')[-1]]),
          ]
          for path, needles in checks:
              text = open(path).read()
              for needle in needles:
                  if needle not in text:
                      sys.exit(f'{path} does not carry {needle!r} from identity.env')
          with open(sys.argv[1] + '/Contents/Info.plist', 'rb') as fh:
              info = plistlib.load(fh)
          if info['CFBundleIdentifier'] != bundle or info['CFBundleExecutable'] != exe:
              sys.exit('built bundle identity disagrees with identity.env')
          # Upstream is a separate product someone may have installed on purpose, and the
          # cleanup routine that came with this code deletes bundles BY ID. Quoted, so the
          # comments explaining why the id is absent do not trip the check.
          for path in ('Sources/main.swift', 'Sources/Updates.swift', 'hooks/lifecycle.js', 'hooks/update.js'):
              if '"com.local.claudestatusbar"' in open(path).read():
                  sys.exit(path + " uses upstream's bundle id as a literal")
          # The rename's last straggler was an environment variable, which none of the checks
          # above look at: every knob is CONTROL_BAR_*, and the old prefix must not come back.
          import subprocess
          tracked = subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout.split()
          for path in tracked:
              if path == 'CHANGELOG.md' or not path.endswith(('.py', '.js', '.sh', '.swift', '.md', '.json')):
                  continue
              if 'CLAUDE_STATUSBAR' in open(path, errors='replace').read():
                  sys.exit(path + ' still uses the CLAUDE_STATUSBAR_ prefix; the knobs are CONTROL_BAR_*')
          print('identity consistent:', bundle, exe)
          PY
