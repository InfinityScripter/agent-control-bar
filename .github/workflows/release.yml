name: Release

# Cuts and publishes a release. A bare tag is not enough: the app's daily update check reads
# the releases API and never sees un-released tags, and the one-click update downloads the
# tag's DMG only after that check offered it.
#
# Two ways in. A push to main that changes the plugin manifest's version releases that version
# by itself: the tag is `v<version>`, and when it already exists the push is not a release (a
# manifest edit that left the number alone, or a re-run of history) and the workflow stops. A
# manual dispatch names the tag and the commit explicitly, for re-cutting a release by hand.
#
# The tag is created here when it does not exist yet — annotated, like every tag this
# repository has carried so far — and reused as-is when it does. The notes are the tagged
# commit's own CHANGELOG.md section: the same text the in-app "What's new" window shows,
# extracted with the same boundaries Sources/Changelog.swift uses (from the version's
# `## [x.y.z] - date` heading to the next `## [`). A version bump without its CHANGELOG
# section fails here, before anything is tagged.
#
# The DMG is built by a second job on a macOS runner, from the tag's own checkout, with the
# same `./build.sh --dmg` a maintainer would run by hand. It is ad-hoc signed and not
# notarized: the runner has no Developer ID certificate, which is also the state every
# release so far has shipped in (README, "Gatekeeper"). Uploaded with --clobber so re-running
# the workflow for an existing release replaces the asset instead of failing on it. The app's
# one-click update installs exactly this file, checked against the size and sha256 the
# releases API reports for it — and against `<dmg>.sig`, an Ed25519 signature made here with
# the UPDATE_SIGNING_KEY secret (tools/update-signing/sign.js), once the app carries the
# public key (UpdateFeed.signingKey). With the key in the app, a release without a valid
# signature fails here instead of shipping an update every installed copy would refuse.
#
# Write access is scoped per job. The macOS job runs build.sh — the most code of any step —
# with a read-only token and hands the image over as a workflow artifact; only the two small
# ubuntu jobs that tag and upload can write to the repository, and only the upload job ever
# sees the signing key.
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.7.12); created at `target` if it does not exist"
        required: true
      target:
        description: "Commit SHA or branch the tag marks when it has to be created"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.target || github.sha }}

      # Inputs go through env, not ${{ }}-interpolation inside the scripts: an input is
      # attacker-shaped text as far as the shell is concerned, and env keeps it data.
      - name: Resolve the tag — from the input, or from the manifest on a push
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "tag $TAG already exists — this push is not a release"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create the tag if it does not exist, else check it out
        if: steps.tag.outputs.released == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — releasing the commit it marks"
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "$TAG"
          else
            echo "creating annotated tag $TAG at $(git rev-parse HEAD)"
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Extract this version's CHANGELOG section
        if: steps.tag.outputs.released == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - "$TAG" <<'PY'
          import re
          import sys

          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md carries no section for {version} — release aborted")
          with open("release-notes.md", "w") as fh:
              fh.write(match.group(1).strip() + "\n")
          print(f"notes for {version}: {len(match.group(1))} characters")
          PY

      - name: Publish the release
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Claude Control Bar ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag

  dmg:
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # The tag, not `target`: `target` may be a branch that moved on since the tag was cut.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          persist-credentials: false

      # The Finder window layout inside build.sh needs a Finder that accepts Apple events; on a
      # runner that step reports itself skipped and the image still carries the app and the
      # Applications shortcut. The job timeout is the guard against it hanging instead.
      - name: Build the DMG
        run: ./build.sh --dmg

      - name: Hand the DMG to the upload job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dmg
          path: build/claude-control-bar.dmg
          retention-days: 1
          if-no-files-found: error

  attach:
    needs: [publish, dmg]
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The tag's checkout for two files only: the signing tool, and the public key the app of
      # this very release was built with. Nothing from it is built or run besides sign.js.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dmg
          path: dist

      # The key the app will check against, read from the tagged source — so a key rotated in
      # the app and not in the secret (or the other way round) fails here, not on users' Macs.
      - name: Sign the DMG
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          APP_KEY="$(sed -nE 's/^ *static let signingKey = "([^"]*)".*/\1/p' Sources/Model/UpdateFeed.swift)"
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ -n "$APP_KEY" ]; then
              echo "The app requires signed updates, but the UPDATE_SIGNING_KEY secret is not set." >&2
              exit 1
            fi
            echo "Release signing is not set up (no UPDATE_SIGNING_KEY secret) — publishing unsigned."
            exit 0
          fi
          node tools/update-signing/sign.js sign dist/claude-control-bar.dmg > dist/claude-control-bar.dmg.sig
          if [ -n "$APP_KEY" ]; then
            node tools/update-signing/sign.js verify dist/claude-control-bar.dmg \
              dist/claude-control-bar.dmg.sig "$APP_KEY"
          else
            echo "Signed, but UpdateFeed.signingKey is empty: this release's app does not check it yet."
          fi

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          files=(dist/claude-control-bar.dmg)
          if [ -f dist/claude-control-bar.dmg.sig ]; then files+=(dist/claude-control-bar.dmg.sig); fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
