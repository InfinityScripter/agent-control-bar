name: Label issues filed outside the templates
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  tripwire:
    runs-on: ubuntu-latest
    # Skip the maintainer's own issues (e.g. the pinned known-issues thread).
    if: github.event.issue.author_association != 'OWNER'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const body = context.payload.issue.body || "";
            // Every web-created issue must pass through an issue form (blank issues are
            // disabled), and both forms stamp this heading into the body. Its absence
            // means the issue arrived via the CLI/API and skipped preflight + auto-labels.
            if (body.includes("### Preflight Checklist")) return;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body: [
              "🤖 Beep. Automated note, no offense meant: this issue was filed outside the issue forms (usually via the GitHub CLI or an agent), so it skipped the preflight checklist and didn't get labeled as a bug or a feature request.",
              "",
              `Nothing is closed and a human will read this either way. You can speed things up by replying with which one this is (bug or feature request), or by refiling through the [issue forms](https://github.com/${owner}/${repo}/issues/new/choose).`,
            ].join("\n") });
